<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Image Resizer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="toolbar__left">
      <h1 class="toolbar__title">Multi Image Resizer</h1>
    </div>
    <div class="toolbar__actions">
      <button class="btn btn--primary" id="btn-add" title="Add Images">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Add Images</span>
      </button>
      <button class="btn btn--success" id="btn-process" disabled title="Process All Images">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        <span>Process</span>
      </button>
      <button class="btn btn--info" id="btn-download" disabled title="Download ZIP">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>ZIP</span>
      </button>
      <button class="btn btn--danger" id="btn-clear" disabled title="Remove All Images">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Clear</span>
      </button>
    </div>
  </header>

  <main class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__toggle" id="sidebar-toggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Settings</span>
      </div>
      <div class="sidebar__content" id="sidebar-content">
        <!-- Settings panels will be mounted here -->
      </div>
    </aside>

    <section class="content" id="content">
      <div class="dropzone" id="dropzone">
        <div class="dropzone__inner">
          <svg class="dropzone__icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p class="dropzone__text">Drag images here</p>
          <p class="dropzone__subtext">or click to select</p>
          <p class="dropzone__formats">JPG, PNG, WebP, AVIF, GIF, BMP</p>
        </div>
        <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp,image/avif,image/gif,image/bmp" hidden>
      </div>

      <div class="image-grid" id="image-grid" hidden>
        <!-- Virtual grid renders here -->
      </div>

      <div class="progress-bar" id="progress-bar" hidden>
        <div class="progress-bar__fill" id="progress-fill"></div>
        <span class="progress-bar__text" id="progress-text"></span>
      </div>
    </section>
  </main>

  <footer class="statusbar" id="statusbar">
    <span id="status-text">Ready</span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
